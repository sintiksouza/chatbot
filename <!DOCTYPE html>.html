<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Chatbot de Perguntas</title>
</head>
<body>

    <h2>Faça uma Pergunta:</h2>
    <form id="form-pergunta">
        <input type="text" id="campo-pergunta" placeholder="Digite sua pergunta">
        <button type="submit">Enviar</button>
    </form>

    <p><strong>Resposta:</strong> <span id="resposta"></span></p>

    <h3>Adicionar Nova Pergunta/Resposta:</h3>
    <form id="form-adiciona-faq">
        <input type="text" id="nova-pergunta" placeholder="Nova pergunta"><br>
        <input type="text" id="nova-resposta" placeholder="Resposta correspondente"><br>
        <button type="submit">Adicionar</button>
    </form>

    <p id="mensagem-faq"></p>

    <script src="custom.js"></script>
</body>
</html>
